name: verify ollama key
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Test minimax-m3 on Ollama Cloud
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/resp.json -w "%{http_code}" --max-time 60 \
            https://ollama.com/v1/chat/completions \
            -H "Authorization: Bearer ${OLLAMA_API_KEY}" \
            -H "content-type: application/json" \
            -d '{"model":"minimax-m3","messages":[{"role":"user","content":"Reply with exactly OK"}],"max_tokens":10}')
          echo "HTTP $code"
          head -c 300 /tmp/resp.json
          echo
          [ "$code" = "200" ] || exit 1
